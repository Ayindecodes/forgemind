name: Gate

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # Pinned: the visual baselines depend on the runner's Chromium and fonts.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Install Chromium for the browser tests
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @forgemind/web exec playwright install --with-deps chromium
      - name: Run the gate
        run: scripts/gate.sh
      - name: Keep the browser evidence of a failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-results
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7
