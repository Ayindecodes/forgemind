[project]
name = "forgemind-api"
version = "0.1.0"
description = "The ForgeMind API: sessions, organizations, repositories, tasks and the execution record, behind the contract in packages/contract."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-sdk>=1.45.2",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.3",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "testcontainers[postgres]>=4.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forgemind_api"]

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN", "T20"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.pyright]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
