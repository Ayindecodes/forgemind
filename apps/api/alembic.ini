# Alembic reads script_location and the URL from forgemind_api.db at runtime;
# this file lets the alembic CLI find the migrations when run by hand.
[alembic]
script_location = src/forgemind_api/migrations
prepend_sys_path = src
sqlalchemy.url = postgresql+psycopg://forgemind:forgemind@127.0.0.1:5440/forgemind
