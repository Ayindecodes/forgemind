# Local development: the API, a worker and the sweeper with PostgreSQL and
# Redis, on localhost-only ports that nothing else on this machine uses.
name: forgemind

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: forgemind
      POSTGRES_PASSWORD: forgemind
      POSTGRES_DB: forgemind
    ports:
      - '127.0.0.1:5440:5432'
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U forgemind -d forgemind']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '127.0.0.1:6390:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: apps/api
      args:
        COMMIT: ${COMMIT:-unknown}
    command: ['python', '-m', 'forgemind_api', 'migrate']
    environment:
      FORGEMIND_ENVIRONMENT: development
      FORGEMIND_DATABASE_URL: postgresql+psycopg://forgemind:forgemind@postgres:5432/forgemind
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    build:
      context: apps/api
      args:
        COMMIT: ${COMMIT:-unknown}
    command: ['python', '-m', 'forgemind_api', 'seed']
    environment:
      FORGEMIND_ENVIRONMENT: development
      FORGEMIND_DATABASE_URL: postgresql+psycopg://forgemind:forgemind@postgres:5432/forgemind
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build:
      context: apps/api
      args:
        COMMIT: ${COMMIT:-unknown}
    environment:
      FORGEMIND_ENVIRONMENT: development
      FORGEMIND_WEB_ORIGIN: http://localhost:3200
      FORGEMIND_API_ORIGIN: http://localhost:4200
      FORGEMIND_LOG_LEVEL: INFO
      FORGEMIND_DATABASE_URL: postgresql+psycopg://forgemind:forgemind@postgres:5432/forgemind
      FORGEMIND_REDIS_URL: redis://redis:6379/0
    ports:
      - '127.0.0.1:4200:4200'
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Executes the runs the API queues. Killed mid-run, it leaves the run to
  # the sweeper, which hands it to the next worker.
  worker:
    build:
      context: apps/api
      args:
        COMMIT: ${COMMIT:-unknown}
    command: ['python', '-m', 'forgemind_api', 'worker']
    environment:
      FORGEMIND_ENVIRONMENT: development
      FORGEMIND_LOG_LEVEL: INFO
      FORGEMIND_DATABASE_URL: postgresql+psycopg://forgemind:forgemind@postgres:5432/forgemind
      FORGEMIND_REDIS_URL: redis://redis:6379/0
    # The image's health check asks the API's port, which a worker has not got.
    healthcheck:
      disable: true
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Queues again the runs whose worker went quiet or whose message was lost,
  # and ends the ones that may not be tried again.
  sweeper:
    build:
      context: apps/api
      args:
        COMMIT: ${COMMIT:-unknown}
    command: ['python', '-m', 'forgemind_api', 'sweeper']
    environment:
      FORGEMIND_ENVIRONMENT: development
      FORGEMIND_LOG_LEVEL: INFO
      FORGEMIND_DATABASE_URL: postgresql+psycopg://forgemind:forgemind@postgres:5432/forgemind
      FORGEMIND_REDIS_URL: redis://redis:6379/0
    healthcheck:
      disable: true
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres:
